<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM API Test Console</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 1fr 420px; height: 100vh; }
  main { overflow: auto; padding: 12px 16px; }
  aside { border-left: 1px solid #ccc; padding: 12px; overflow: auto; background: #fafafa; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  h2 { font-size: 13px; margin: 18px 0 6px; text-transform: uppercase; color: #555; }
  form { border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; margin: 0 0 8px; background: #fff; }
  form b { display: block; margin-bottom: 4px; }
  label { display: inline-block; margin: 2px 8px 2px 0; font-size: 12px; color: #444; }
  input, select { display: block; padding: 3px 5px; font: inherit; min-width: 150px; }
  button { margin-top: 4px; padding: 4px 12px; cursor: pointer; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 0 0 12px; }
  .ok { color: #0a7a2f; } .err { color: #b3261e; }
  #token { width: 100%; box-sizing: border-box; font-size: 11px; }
  small { color: #777; }
</style>
</head>
<body>
<main>
  <h1>CRM API Test Console <small>(dev only)</small></h1>
  <div>Token (set automatically on login, or paste one): <input id="token" placeholder="not logged in"></div>
  <datalist id="ids"></datalist>
  <div id="forms"></div>
</main>
<aside>
  <b>Responses</b> <button onclick="out.textContent=''">clear</button>
  <div id="out"></div>
</aside>
<script>
const out = document.getElementById('out');
const tokenInput = document.getElementById('token');
tokenInput.value = sessionStorage.getItem('token') || '';
tokenInput.onchange = () => sessionStorage.setItem('token', tokenInput.value.trim());

const T = 'text', B = 'bool';
const STATUSES = ['INCOMING', 'RINGING', 'CONNECTED', 'CLOSED', 'LOST', 'BROKER'];
const SOURCES = ['99ACRES', 'MAGICBRICKS'];
const DESIGNATIONS = ['SALES_EXECUTIVE', 'EXECUTIVE_MANAGER'];
// field: [name, kind, extra]. kind: text | bool | ['opt1','opt2'] (select). extra: 'path' = goes in the URL, 'id' = suggests known ids,
// 'number' = sent as a number, 'list' = comma-separated values sent as an array
const F = (name, kind = T, extra = '') => ({ name, kind, extra });

const sections = [
  ['1. Login', [
    ['Admin login (email or username)', 'POST', '/auth/admin/login', [F('email'), F('username'), F('password')], 'login'],
    ['Manager login (email or username)', 'POST', '/auth/manager/login', [F('email'), F('username'), F('password')], 'login'],
    ['Sales executive / executive manager login (email or username)', 'POST', '/auth/executive/login', [F('email'), F('username'), F('password')], 'login'],
    ['Who am I', 'GET', '/auth/me', []],
  ]],
  ['2. Managers, teams & executives (admin)', [
    ['Create manager', 'POST', '/admin/managers', [F('name'), F('email'), F('phone'), F('username'), F('password')]],
    ['List managers', 'GET', '/admin/managers', []],
    ['Manager details (+ teams they lead)', 'GET', '/admin/managers/{id}', [F('id', T, 'path id')]],
    ['Activate / deactivate manager', 'PATCH', '/admin/managers/{id}/status', [F('id', T, 'path id'), F('isActive', B)]],
    ['Create team (managerId = who leads it)', 'POST', '/admin/teams', [F('name'), F('description'), F('managerId', T, 'id')]],
    ['Set / clear team manager', 'PATCH', '/admin/teams/{id}', [F('id', T, 'path id'), F('managerId', T, 'id')]],
    ['List teams', 'GET', '/admin/teams', []],
    ['Create sales executive / executive manager', 'POST', '/admin/executives', [F('name'), F('email'), F('phone'), F('username'), F('password'), F('designation', DESIGNATIONS), F('teamId', T, 'id')]],
    ['Change designation', 'PATCH', '/admin/executives/{id}', [F('id', T, 'path id'), F('designation', DESIGNATIONS)]],
    ['List executives', 'GET', '/admin/executives', []],
    ['Activate / deactivate executive', 'PATCH', '/admin/executives/{id}/status', [F('id', T, 'path id'), F('isActive', B)]],
    ['Put executive in team', 'PATCH', '/admin/executives/{id}/team', [F('id', T, 'path id'), F('teamId', T, 'id')]],
    ['Team members', 'GET', '/admin/teams/{id}/executives', [F('id', T, 'path id')]],
  ]],
  ['3. Properties (admin). Created automatically by leads; pick their executives here', [
    ['List properties (assigned=false => need executives)', 'GET', '/admin/properties', []],
    ['Property details', 'GET', '/admin/properties/{id}', [F('id', T, 'path id')]],
    ['Set property executives (replaces list; comma-separated ids)', 'PUT', '/admin/properties/{id}/executives', [F('id', T, 'path id'), F('executiveIds', T, 'list')]],
    ['Edit property', 'PATCH', '/admin/properties/{id}', [F('id', T, 'path id'), F('name'), F('description'), F('location')]],
    ['Activate / deactivate property', 'PATCH', '/admin/properties/{id}/status', [F('id', T, 'path id'), F('isActive', B)]],
    ['Assignment history', 'GET', '/admin/properties/{id}/assignment-history', [F('id', T, 'path id')]],
  ]],
  ['4. Enquiry / leads (admin)', [
    ['Send enquiry (client + property + lead + round-robin)', 'POST', '/admin/leads', [F('name'), F('mobile'), F('email'), F('propertyName'), F('source', SOURCES), F('requirement'), F('budget', T, 'number'), F('message')]],
    ['List all leads (?status=PENDING_ASSIGNMENT for unassigned; ?followUp=overdue|today|upcoming|none&tz=Asia/Kolkata)', 'GET', '/admin/leads', []],
    ['Lead details + client history', 'GET', '/admin/leads/{id}', [F('id', T, 'path id')]],
    ['Update lead status', 'PATCH', '/admin/leads/{id}/status', [F('id', T, 'path id'), F('status', STATUSES)]],
    ['Assign / reassign lead to a sales executive', 'PATCH', '/admin/leads/{id}/assign', [F('id', T, 'path id'), F('executiveId', T, 'id')]],
    ['Mark lead important (for me)', 'POST', '/admin/leads/{id}/important', [F('id', T, 'path id')]],
    ['Unmark lead important (for me)', 'DELETE', '/admin/leads/{id}/important', [F('id', T, 'path id')]],
    ['Set / change follow-up (your local time; empty followUpAt clears)', 'PUT', '/admin/leads/{id}/follow-up', [F('id', T, 'path id'), F('followUpAt', T, 'datetime'), F('followUpNote')]],
    ['Clear follow-up', 'DELETE', '/admin/leads/{id}/follow-up', [F('id', T, 'path id')]],
    ['List clients', 'GET', '/admin/customers', []],
  ]],
  ['5. Manager view (login as manager first)', [
    ['My teams', 'GET', '/manager/teams', []],
    ['Executives in my teams', 'GET', '/manager/executives', []],
    ['Leads of my teams + unassigned (?status=PENDING_ASSIGNMENT)', 'GET', '/manager/leads', []],
    ['Lead details + client history', 'GET', '/manager/leads/{id}', [F('id', T, 'path id')]],
    ['Assign / reassign to an executive of my teams', 'PATCH', '/manager/leads/{id}/assign', [F('id', T, 'path id'), F('executiveId', T, 'id')]],
    ['Mark lead important (for me)', 'POST', '/manager/leads/{id}/important', [F('id', T, 'path id')]],
    ['Unmark lead important (for me)', 'DELETE', '/manager/leads/{id}/important', [F('id', T, 'path id')]],
    ['Set / change follow-up (your local time; empty followUpAt clears)', 'PUT', '/manager/leads/{id}/follow-up', [F('id', T, 'path id'), F('followUpAt', T, 'datetime'), F('followUpNote')]],
    ['Clear follow-up', 'DELETE', '/manager/leads/{id}/follow-up', [F('id', T, 'path id')]],
  ]],
  ['Settings (admin): lead assignment rule', [
    ['Get assignment rule', 'GET', '/admin/settings/assignment-rule', []],
    ['Set assignment rule', 'PUT', '/admin/settings/assignment-rule', [F('rule', ['ROUND_ROBIN'])]],
    ['Get lead timeout (minutes)', 'GET', '/admin/settings/lead-timeout', []],
    ['Set lead timeout (minutes)', 'PUT', '/admin/settings/lead-timeout', [F('minutes', T, 'number')]],
  ]],
  ['6. Executive view (login as sales executive / executive manager first)', [
    ['My dashboard counts', 'GET', '/executive/leads/summary', []],
    ['My leads (new ones first)', 'GET', '/executive/leads', []],
    ['Open a lead (+ client history, clears "New")', 'GET', '/executive/leads/{id}', [F('id', T, 'path id')]],
    ['Update my lead status', 'PATCH', '/executive/leads/{id}/status', [F('id', T, 'path id'), F('status', STATUSES)]],
    ['Mark lead important (for me)', 'POST', '/executive/leads/{id}/important', [F('id', T, 'path id')]],
    ['Unmark lead important (for me)', 'DELETE', '/executive/leads/{id}/important', [F('id', T, 'path id')]],
    ['Set / change follow-up (your local time; empty followUpAt clears)', 'PUT', '/executive/leads/{id}/follow-up', [F('id', T, 'path id'), F('followUpAt', T, 'datetime'), F('followUpNote')]],
    ['Clear follow-up', 'DELETE', '/executive/leads/{id}/follow-up', [F('id', T, 'path id')]],
  ]],
];

// Remember every {id, name} seen in responses so id fields can suggest them.
const known = new Map();
function collect(v) {
  if (Array.isArray(v)) return v.forEach(collect);
  if (v && typeof v === 'object') {
    if (typeof v.id === 'string' && (v.name || v.username)) known.set(v.id, v.name || v.username);
    Object.values(v).forEach(collect);
  }
}
function refreshIds() {
  const dl = document.getElementById('ids');
  dl.replaceChildren(...[...known].map(([id, name]) => Object.assign(document.createElement('option'), { value: id, label: name })));
}

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => e.append(k));
  return e;
}

async function run(method, pathTpl, fields, kind, values) {
  let path = pathTpl;
  const body = {};
  const pathVars = fields.filter((f) => f.extra.includes('path'));
  for (const f of fields) {
    const v = values[f.name];
    if (f.extra.includes('datetime') && v === '') { body[f.name] = null; continue; } // empty clears the follow-up
    if (f.extra.includes('path')) path = path.replace(`{${f.name}}`, encodeURIComponent(v));
    else if (v !== '' && v !== undefined) {
      body[f.name] = f.extra.includes('datetime') ? new Date(v).toISOString() : f.kind === B ? v === 'true' : f.extra.includes('number') ? Number(v) : f.extra.includes('list') ? v.split(',').map((x) => x.trim()).filter(Boolean) : v;
    }
  }
  const headers = {};
  const hasBody = method !== 'GET' && method !== 'DELETE' && fields.length > pathVars.length;
  if (hasBody) headers['content-type'] = 'application/json';
  if (tokenInput.value.trim()) headers.authorization = 'Bearer ' + tokenInput.value.trim();

  let status = 'network error', data;
  try {
    const res = await fetch('/api/v1' + path, { method, headers, body: hasBody ? JSON.stringify(body) : undefined });
    status = res.status;
    data = await res.json().catch(() => null);
  } catch (e) { data = String(e); }

  if (kind === 'login' && data && data.accessToken) {
    tokenInput.value = data.accessToken;
    sessionStorage.setItem('token', data.accessToken);
  }
  collect(data);
  refreshIds();
  const okay = typeof status === 'number' && status < 400;
  out.prepend(el('pre', {}, el('b', { className: okay ? 'ok' : 'err' }, `${status}  `), `${method} /api/v1${path}\n${JSON.stringify(data, null, 2)}`));
}

const root = document.getElementById('forms');
for (const [title, forms] of sections) {
  root.append(el('h2', {}, title));
  for (const [label, method, path, fields, kind] of forms) {
    const inputs = {};
    const form = el('form', {}, el('b', {}, `${label} `, el('small', {}, `${method} ${path}`)));
    for (const f of fields) {
      let input;
      if (Array.isArray(f.kind)) input = el('select', {}, ...f.kind.map((o) => el('option', { value: o }, o)));
      else if (f.kind === B) input = el('select', {}, el('option', { value: 'true' }, 'true'), el('option', { value: 'false' }, 'false'));
      else { input = el('input', { type: f.name.toLowerCase().includes('password') ? 'password' : f.extra.includes('datetime') ? 'datetime-local' : 'text', autocomplete: 'off' }); if (f.extra.includes('id')) input.setAttribute('list', 'ids'); }
      inputs[f.name] = input;
      form.append(el('label', {}, f.name, input));
    }
    form.append(el('button', { type: 'submit' }, 'Send'));
    form.onsubmit = (e) => {
      e.preventDefault();
      run(method, path, fields, kind, Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value.trim()])));
    };
    root.append(form);
  }
}
</script>
</body>
</html>
